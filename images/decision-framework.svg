<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330"><title>From data to better decisions</title><desc>Data informs mathematical models. Models define objectives and constraints for optimization. Optimization supports decisions. Observed outcomes feed back into data and model validation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#4a74b9"/></marker></defs><rect x="1" y="1" width="798" height="328" rx="8" fill="#f8fafd" stroke="#e2e8f0"/><g font-family="Georgia,serif" text-anchor="middle"><text x="400" y="34" fill="#2d3748" font-size="18">From real-world observations to better decisions</text><g fill="#fff" stroke="#cbd8e9"><rect x="24" y="89" width="155" height="132" rx="7"/><rect x="220" y="89" width="166" height="132" rx="7"/><rect x="427" y="89" width="155" height="132" rx="7"/><rect x="623" y="89" width="153" height="132" rx="7" fill="#eaf0f9" stroke="#4a74b9"/></g><g fill="#4a74b9" font-size="11"><text x="101" y="113">01 / OBSERVE</text><text x="303" y="113">02 / REPRESENT</text><text x="504" y="113">03 / SOLVE</text><text x="699" y="113">04 / ACT</text></g><g fill="#2d3748" font-size="17"><text x="101" y="143">Data</text><text x="303" y="141">Mathematical</text><text x="303" y="162">modeling</text><text x="504" y="143">Optimization</text><text x="699" y="141">Better</text><text x="699" y="162">decisions</text></g><g fill="#4a5568" font-size="12"><text x="101" y="177">Mobility, demand,</text><text x="101" y="195">space and behavior</text><text x="303" y="188">Dynamics, uncertainty,</text><text x="303" y="205">objectives and constraints</text><text x="504" y="177">Programming, RL</text><text x="504" y="195">and hybrid methods</text><text x="699" y="188">Design, pricing</text><text x="699" y="205">and fleet operations</text></g><g fill="none" stroke="#4a74b9" stroke-width="1.8" marker-end="url(#arrow)"><path d="M180 153H215"/><path d="M387 153H422"/><path d="M583 153H618"/><path d="M700 226V277H102V226"/></g><rect x="220" y="261" width="361" height="31" fill="#f8fafd"/><text x="400" y="281" font-size="12" fill="#4a74b9">Observe outcomes · Validate models · Update decisions</text><text x="400" y="312" font-size="11" fill="#637187">Machine learning helps estimate patterns, dynamics, and decision policies.</text></g></svg>